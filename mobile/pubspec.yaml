name: aidatpanel
description: "AidatPanel - Türk apartman ve site yöneticileri için mobil aidat yönetim platformu."
publish_to: 'none'

# --- Google Play (sürüm kodu = + sonrası; her AAB öncesi +1 — CLAUDE.md) ---
version: 0.2.0+1778674187

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.3.0

  # Network
  dio: ^5.4.0
  flutter_secure_storage: ^10.3.1
  web_socket_channel: ^3.0.2

  # i18n (Slang)
  slang: ^4.15.0
  slang_flutter: ^4.15.0

  # Firebase (FAZ 2 — push / FCM)
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.3


  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  share_plus: ^13.1.0
  package_info_plus: ^10.1.0
  image_picker: ^1.2.1
  file_picker: ^12.0.0-beta.5
  path_provider: ^2.1.5
  crypto: ^3.0.6

  google_fonts: ^8.1.0
  fl_chart: ^0.70.2
  pdfx: ^2.9.2
  receive_sharing_intent: ^1.8.1
  gal: ^2.3.2
  image_cropper: ^12.2.1
  image: ^4.9.1
  crop_your_image: ^2.0.0
  purchases_flutter: ^10.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.12.2
  slang_build_runner: ^4.15.0
  flutter_launcher_icons: ^0.14.4

# Transitive sürümler — pub outdated uyarılarını kapatır (SDK/ekosistem kilidi).
dependency_overrides:
  _fe_analyzer_shared: ^100.0.0
  analyzer: ^13.0.0
  cli_util: ^0.5.1
  dart_style: ^3.1.9
  flutter_secure_storage_darwin: ^0.4.0
  image: ^4.9.1
  matcher: ^0.12.20
  meta: ^1.18.2
  test: ^1.31.1
  test_api: ^0.7.12
  test_core: ^0.6.18
  vector_math: ^2.4.0
  xml: ^7.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  assets:
    - assets/brand/app_logo.png
    - assets/profile/default_avatar.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_logo.png
  # Marka: beyaz zemin + logo (adaptive arka plan mavi olursa logo bozulur).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/app_logo.png
  remove_alpha_ios: true
